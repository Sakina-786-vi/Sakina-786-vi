name: Update sword contribution animation

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate sword SVG from real contributions
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_sword_svg.py

      - name: Commit updated SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/sword-contributions.svg dist/sword-contributions-light.svg
          git diff --staged --quiet || git commit -m "chore: update sword contribution animation"
          git push
