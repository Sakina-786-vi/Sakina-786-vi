<svg width="100%" height="140" viewBox="0 0 900 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="45%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#c9ced6"/>
      <stop offset="100%" stop-color="#7c828c"/>
    </linearGradient>
    <linearGradient id="hiltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FF6B6B"/>
    </linearGradient>
    <radialGradient id="sparkGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE082" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FF8E53" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="revealClip">
      <rect x="0" y="0" width="0" height="140">
        <animate attributeName="width" values="0;900;900;0" keyTimes="0;0.45;0.9;1" dur="4s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Background track line -->
  <line x1="20" y1="70" x2="880" y2="70" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4 6"/>

  <!-- Revealed text, wiped in by the sword -->
  <g clip-path="url(#revealClip)">
    <text x="450" y="82" text-anchor="middle" font-family="Fira Code, monospace" font-size="34" font-weight="700" fill="#FF6B6B">
      SLICING THROUGH BUGS, ONE COMMIT AT A TIME
    </text>
  </g>

  <!-- Traveling sword group -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="-60,0; 900,0; 900,0; -60,0"
      keyTimes="0;0.45;0.9;1"
      dur="4s" repeatCount="indefinite"/>

    <!-- spark glow at tip -->
    <circle cx="60" cy="70" r="18" fill="url(#sparkGrad)">
      <animate attributeName="r" values="12;22;12" dur="0.6s" repeatCount="indefinite"/>
    </circle>

    <!-- blade -->
    <polygon points="0,70 55,62 60,70 55,78" fill="url(#bladeGrad)" stroke="#4b4f57" stroke-width="1"/>
    <!-- hilt guard -->
    <rect x="-6" y="64" width="6" height="12" fill="url(#hiltGrad)"/>
    <!-- grip -->
    <rect x="-18" y="66" width="12" height="8" rx="2" fill="#3b2f2f"/>
    <!-- pommel -->
    <circle cx="-22" cy="70" r="4" fill="#FFC107"/>
  </g>

  <!-- ambient sparkle dots -->
  <circle cx="150" cy="40" r="2" fill="#FFC107">
    <animate attributeName="opacity" values="0;1;0" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="105" r="2" fill="#FF8E53">
    <animate attributeName="opacity" values="0;1;0" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="35" r="2" fill="#FF6B6B">
    <animate attributeName="opacity" values="0;1;0" dur="2s" begin="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
